<html>
<head>
<title> Student Registration Form </title>
</head>

<body text="black" bgcolor="white" align="center">
<font face="calibri">
<h2> <b> <i> Student Registration Form </i> </b> </h2>

<hr width="250"> 
<form>
<br> 
Student Name: <input type="text" name="Student Name" placeholder="Full Name"> <br> <br>
Father's Name: <input type="text" name="Father's Name" placeholder="Father's Full Name"> <br> <br>
Mother's Name: <input type="text" name="Mother's Name" placeholder="Mother's Full Name"> <br> <br>
Gender: <input type="radio" name="Gender" value="Male" checked> Male <input type="radio" name="Gender" name="Female"> Female <br> <br>
Date of Birth: <input type="text" name="Date of Birth" placeholder="DD/MM/YY"> <br> <br>

Level: <select name="Level">
<option value= "Super-Seniors"> Super-Seniors </option>
<option value= "Seniors"> Seniors </option>
<option value= "Pre-Seniors"> Pre-Seniors </option>
<option value= "Juniors"> Juniors </option>
<option value= "Sub-Juniors"> Sub-Juniors </option>
</select> <br> <br>

Linguistic Ability: <br> <br> <select name="Linguistic Ability" multiple>
<option name="Linguistic Ability" value= "Arabic"> Arabic </option>
<option name="Linguistic Ability" value= "English"> English </option>
<option name="Linguistic Ability" value= "French"> French </option>
<option name="Linguistic Ability" value= "German"> German </option>
<option name="Linguistic Ability" value= "Hindi"> Hindi </option>
<option name="Linguistic Ability" value= "Italian"> Italian </option>
<option name="Linguistic Ability" value= "Japenese"> Japenese </option>
<option name="Linguistic Ability" value= "Korean"> Korean </option>
<option name="Linguistic Ability" value= "Malayalam"> Malayalam </option>
<option name="Linguistic Ability" value= "Marathi"> Marathi </option>
<option name="Linguistic Ability" value= "Spanish"> Spanish </option>
<option name="Linguistic Ability" value= "Tamil"> Tamil </option>
<option name="Linguistic Ability" value= "Urdu"> Urdu </option>
<option name="Linguistic Ability" value= "Other Lanugages"> Other Languages </option>
</select> <br> <br>

Interests: 
<input type="checkbox" name="Interest" value="Playing"> Playing </input> 
<input type="checkbox" name="Interest" value="Dancing"> Dancing </input> 
<input type="checkbox" name="Interest" value="Singing"> Singing </input> 
<input type="checkbox" name="Interest" value="Reading"> Reading </input> 
<input type="checkbox" name="Interest" value="Drawing"> Drawing </input>
<input type="checkbox" name="Interest" value="Coding"> Coding </input> <br> <br> <br>

Student ID: <input type="text" name="Student ID" placeholder="Student ID"> <br> <br>
Password: <input type="password" name="Password" placeholder="Password"> <br> <br>

<input type="Reset" name="Reset" value="Reset">
<input type="Submit" name="Submit" value="Submit">

</font>
</form>
</body>
</html>
